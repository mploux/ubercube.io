<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="UBERCUBE — Multiplayer voxel FPS." />
    <title>Ubercube</title>
    <link rel="preload" href="/assets/ui/fonts/RifficFree-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <img id="lobby-background" src="/assets/ui/LoadingBG.png" alt="" hidden />
    <canvas id="lobby-map" width="1920" height="1080" aria-label="Map" hidden></canvas>
    <canvas id="viewport" aria-label="UBERCUBE world"></canvas>
    <main>
      <section id="entry-screen" class="screen">
        <h1 class="entry-title">Ubercube</h1>
        <form id="join-form">
          <label class="nickname-label" for="nickname">Pseudo</label>
          <input id="nickname" name="nickname" class="gui-textbox" autocomplete="nickname" autocapitalize="off" spellcheck="false" enterkeyhint="go" maxlength="24" minlength="2" required />
          <div id="population" class="loading-info">Connecting...</div>
          <button id="join-button" class="gui-button" type="submit"><span>Join game</span></button>
          <p id="join-error" class="error-text" role="alert"></p>
        </form>
      </section>

      <section id="lobby-screen" class="screen" hidden>
        <div class="spawn-stage">
          <div class="weapon-preview" data-preview="assault" aria-hidden="true"></div>
          <div class="weapon-preview" data-preview="sniper" aria-hidden="true"></div>
          <div class="weapon-preview" data-preview="medic" aria-hidden="true"></div>
          <button class="gui-button kit-button" type="button" data-kit="assault" aria-pressed="true">Assault</button>
          <button class="gui-button kit-button" type="button" data-kit="sniper" aria-pressed="false">Sniper</button>
          <button class="gui-button kit-button" type="button" data-kit="medic" aria-pressed="false">Medic</button>
        </div>
      </section>

      <section id="game-hud" class="screen" hidden aria-label="Game HUD">
        <img class="vignette" src="/assets/ui/vignette.png" alt="" />
        <div id="damage-overlay"></div>
        <div id="hud-version" class="hud-version">Ubercube 0.1</div>
        <div id="hud-fps" class="hud-fps"></div>
        <div id="audio-status" class="audio-status" hidden>Audio muted !</div>
        <div id="hud-position" class="hud-position"></div>
        <div id="tdm-scores"><span id="red-score" class="red-score">Red : 0</span><span id="blue-score" class="blue-score">Blue : 0</span></div>
        <div id="match-time" class="match-time" hidden></div>
        <div id="crosshair" hidden></div>
        <div id="scope" hidden></div>
        <div id="headshot-label" hidden>HEADSHOT</div>
        <div class="health-hud"><div id="health-fill"></div><div class="health-text"><span id="health-value">100</span> HP</div></div>
        <div class="weapon-hud" id="ammo-line"><span id="ammo-value">30</span><span id="ammo-max">/30</span></div>
        <div class="minimap-wrap"><canvas id="minimap" width="320" height="220" aria-label="Minimap"></canvas></div>
        <div id="kill-feed" aria-live="polite"></div>
      </section>

      <div id="touch-controls" aria-label="Touch controls" hidden>
        <div id="touch-look" aria-hidden="true"></div>
        <div id="touch-move" aria-label="Move joystick"><div id="touch-stick"></div></div>
        <div class="touch-menu">
          <button class="gui-button touch-button" data-touch-action="pause" type="button" aria-label="Pause">Menu</button>
          <button class="gui-button touch-button" data-touch-action="scores" type="button" aria-label="Hold to show scores">Score</button>
        </div>
        <div class="touch-actions">
          <button id="touch-alt" class="gui-button touch-button" data-touch-action="alt" type="button">Aim</button>
          <button class="gui-button touch-button" data-touch-action="jump" type="button">Saut</button>
          <button id="touch-fire" class="gui-button touch-button" data-touch-action="fire" type="button">Fire</button>
        </div>
        <div class="touch-weapons">
          <button class="gui-button touch-button" data-touch-action="previous" type="button" aria-label="Previous weapon">&#8249;</button>
          <span id="touch-weapon-label">AK-47</span>
          <button class="gui-button touch-button" data-touch-action="next" type="button" aria-label="Next weapon">&#8250;</button>
        </div>
      </div>

      <section id="pause-screen" class="screen" hidden aria-label="Game menu">
        <nav class="pause-menu" aria-label="Pause">
          <button id="resume-button" class="gui-button" type="button">return</button>
          <button id="options-button" class="gui-button" type="button">options</button>
          <button id="graphics-button" class="gui-button" type="button">graphics</button>
          <button id="leave-button" class="gui-button" type="button">disconnect</button>
        </nav>
        <section id="options-panel" class="settings-panel" hidden aria-labelledby="options-title">
          <h2 id="options-title">Options</h2>
          <label class="sensitivity-label" for="sensitivity">Sensitivity (Normal and zoomed)</label>
          <div class="slider-row sensitivity-sliders">
            <div class="gui-slider"><input id="sensitivity" aria-label="Normal sensitivity" type="range" min="0.25" max="2.5" step="0.05" value="1" /><output id="sensitivity-value">1</output></div>
            <div class="gui-slider"><input id="zoom-sensitivity" aria-label="Zoomed sensitivity" type="range" min="0.25" max="2.5" step="0.05" value="1" /><output id="zoom-sensitivity-value">1</output></div>
          </div>
          <label class="audio-label" for="audio-volume">Audio</label>
          <div class="gui-slider audio-slider"><input id="audio-volume" type="range" min="0" max="1" step="0.01" value="1" /><output id="audio-volume-value">100</output></div>
          <button id="back-options" class="gui-button back-settings" data-close-settings type="button">return</button>
        </section>
        <section id="graphics-panel" class="settings-panel" hidden aria-labelledby="graphics-title">
          <h2 id="graphics-title">Graphics</h2>
          <label class="gui-checkbox graphics-vsync" title="La synchronisation de l'affichage est gérée par le navigateur ; une page Web ne peut pas la désactiver."><input id="graphics-vsync" type="checkbox" checked disabled aria-describedby="vsync-info" /><span>Enable vSync</span></label>
          <label class="gui-checkbox graphics-snow"><input id="graphics-snow" type="checkbox" /><span>Render snow</span></label>
          <label class="gui-checkbox graphics-ssaa"><input id="graphics-ssaa" type="checkbox" /><span>Enable SSAA</span></label>
          <label class="gui-checkbox graphics-shadows"><input id="graphics-shadows" type="checkbox" checked /><span>Enable Shadows</span></label>
          <p id="vsync-info" class="graphics-info">vSync : gérée par le navigateur.</p>
          <button id="back-graphics" class="gui-button back-settings" data-close-settings type="button">return</button>
        </section>
      </section>

      <section id="score-screen" class="screen" hidden aria-label="Player list">
        <div id="score-tdm">
          <div class="score-column score-red"><div class="score-header"><span>Name</span><span>K</span><span>D</span><span>Ping</span></div><div class="score-body"><table><tbody id="score-red-rows"></tbody></table></div></div>
          <div class="score-column score-blue"><div class="score-header"><span>Name</span><span>K</span><span>D</span><span>Ping</span></div><div class="score-body"><table><tbody id="score-blue-rows"></tbody></table></div></div>
        </div>
        <div id="score-ffa" class="score-column score-ffa" hidden><div class="score-header"><span>Name</span><span>K</span><span>D</span><span>Ping</span></div><div class="score-body"><table><tbody id="score-rows"></tbody></table></div></div>
      </section>

      <section id="disconnect-screen" class="screen" hidden>
        <p id="disconnect-reason">Disconnected.</p>
        <button id="reconnect-button" class="gui-button" type="button">Reconnect</button>
        <button id="back-button" class="gui-button" type="button">return</button>
      </section>
    </main>
    <div id="toast" role="status" hidden></div>

    <noscript>JavaScript is required to play UBERCUBE.</noscript>
    <script type="module" src="/main.js"></script>
  </body>
</html>
